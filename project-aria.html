<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Last Larch</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Karla:wght@300&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #FFFFF0;
            color: #1A1A1A;
            font-family: 'Karla', sans-serif;
            overflow-x: hidden;
        }

        /* Consistent Mini Header */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }
        header h1 {
            font-family: 'Archivo', sans-serif;
            font-size: 1.2rem;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }
        header img { height: 45px; width: auto; }

        /* Main Content Container */
        .project-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 100px 20px;
        }

        /* Large Hero Image */
        .hero-image {
            width: 100%;
            height: 70vh;
            background-color: #eee;
            margin-bottom: 60px;
            overflow: hidden;
        }
        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Project Text */
        .project-header {
            border-bottom: 1px solid #D4AF37;
            padding-bottom: 30px;
            margin-bottom: 40px;
        }
        .project-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .project-meta {
            font-size: 0.8rem;
            color: #D4AF37;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .project-description {
            font-size: 1.1rem;
            line-height: 1.8;
            column-count: 2; /* Editorial style */
            column-gap: 40px;
            margin-bottom: 60px;
        }

        /* Secondary Images */
        .image-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .image-gallery img { width: 100%; }

        /* Navigation */
        .bottom-nav {
            margin-top: 100px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        .bottom-nav a { text-decoration: none; color: #1A1A1A; opacity: 0.5; }
        .bottom-nav a:hover { opacity: 1; color: #D4AF37; }

        @media (max-width: 768px) {
            .project-description { column-count: 1; }
            .hero-image { height: 40vh; }
            .image-gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Last</h1>
        <a href="index.html"><img src="LL Logo 4.png" alt="Logo"></a>
        <h1>Larch</h1>
    </header>

    <main class="project-content">
        <div class="hero-image">
            <img src="aria_hero.svg" alt="ARIA">
        </div>

        <div class="project-header">
            <h2>ARIA: Alert & Risk Impact Analysis </h2>
            <div class="project-meta">2026 // Common Alerting Protocol (CAP) // GIS</div>
        </div>

        <div class="project-description">
            A system that retrieves and summarizes the exposure data in GIS layers and for defined polygons. Extraction to a spreadsheet or machine-generated summaries for use in CAP-Alerts.
        </div>

        <div class="image-gallery">
            <img src="detail-1.jpg" alt="Detail 1">
            <img src="detail-2.jpg" alt="Detail 2">
        </div>

        <div class="bottom-nav">
            <a href="projects.html">← All Projects</a>
            <a href="index.html">Home</a>
        </div>
    </main>

</body>
</html>
