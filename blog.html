<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinking – Last Larch</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="last_larch.css">
  <style>
    /* Blog-specific styles */
    .blog-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 40px 60px;
    }

    .blog-header {
      border-bottom: var(--rule) solid var(--charcoal);
      padding-bottom: 32px;
      margin-bottom: 48px;
    }

    .blog-header h1 {
      font-family: var(--ff-serif);
      font-size: 52px;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--charcoal);
      margin-bottom: 16px;
    }

    .blog-header p {
      font-family: var(--ff-body);
      font-size: 15px;
      line-height: 1.7;
      font-weight: 300;
      color: var(--char-m);
      max-width: 560px;
    }

    .post {
      margin-bottom: 80px;
      padding-bottom: 80px;
      border-bottom: 0.5px solid var(--ivory-d);
    }

    .post:last-child {
      border-bottom: none;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .post-date {
      font-family: var(--ff-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--char-l);
    }

    .post-category {
      font-family: var(--ff-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-d);
      padding: 4px 12px;
      border: 1px solid var(--gold-d);
    }

    .post-title {
      font-family: var(--ff-serif);
      font-size: 38px;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--charcoal);
      margin-bottom: 20px;
    }

    .post-excerpt {
      font-family: var(--ff-body);
      font-size: 17px;
      line-height: 1.65;
      font-weight: 300;
      color: var(--char-m);
      margin-bottom: 32px;
      max-width: 680px;
    }

    .post-hero {
      width: 100%;
      height: 400px;
      object-fit: cover;
      margin-bottom: 40px;
      border: 0.5px solid var(--ivory-d);
    }

    .post-content {
      font-family: var(--ff-body);
      font-size: 15px;
      line-height: 1.8;
      font-weight: 300;
      color: var(--char-m);
      max-width: 680px;
    }

    .post-content p {
      margin-bottom: 24px;
    }

    .post-content h2 {
      font-family: var(--ff-serif);
      font-size: 26px;
      line-height: 1.2;
      color: var(--charcoal);
      margin-top: 48px;
      margin-bottom: 20px;
    }

    .post-content h3 {
      font-family: var(--ff-serif);
      font-size: 20px;
      line-height: 1.3;
      color: var(--charcoal);
      margin-top: 36px;
      margin-bottom: 16px;
    }

    .post-content img {
      width: 100%;
      max-width: 680px;
      height: auto;
      margin: 32px 0;
      border: 0.5px solid var(--ivory-d);
    }

    .post-content blockquote {
      border-left: var(--rule) solid var(--gold);
      padding-left: 24px;
      margin: 32px 0;
      font-style: italic;
      color: var(--char-m);
    }

    .post-content ul,
    .post-content ol {
      margin: 24px 0 24px 24px;
    }

    .post-content li {
      margin-bottom: 12px;
      padding-left: 8px;
    }

    .post-content a {
      color: var(--charcoal);
      text-decoration: underline;
      text-decoration-color: var(--gold);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
      transition: color 0.15s;
    }

    .post-content a:hover {
      color: var(--gold-d);
    }

    .post-video,
    .post-embed {
      width: 100%;
      max-width: 680px;
      margin: 32px 0;
      border: 0.5px solid var(--ivory-d);
    }

    .post-video video,
    .post-embed iframe {
      width: 100%;
      display: block;
    }

    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--charcoal);
      text-decoration: none;
      margin-top: 24px;
      transition: gap 0.15s;
    }

    .read-more:hover {
      gap: 12px;
    }

    .read-more::after {
      content: '→';
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      font-family: var(--ff-body);
      font-size: 13px;
      color: var(--char-l);
      letter-spacing: 0.1em;
    }

    .error {
      background: #FFF5F5;
      border: 1px solid #E53E3E;
      color: #742A2A;
      padding: 20px;
      margin: 40px 0;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Navigation (reuse from your main site) -->
<nav class="demo-nav">
  <a href="index.html" class="nav-logo">
    <img src="LL Logo 4.png" alt="Last Larch" style="height:32px; width:auto; opacity:0.85;">
    Last Larch
  </a>
  <ul class="nav-links">
    <li><a href="about.html">About</a></li>
    <li class="active"><a href="projects.html">Projects</a></li>
    <li><a href="blog.html">Blog</a></li>
  </ul>
  <div class="nav-cta">
    <a href="mailto:fysh@lastlarch.com" class="btn-primary" style="text-decoration:none;">Contact</a>
  </div>
</nav>

  <!-- Blog Container -->
  <div class="blog-container">
    <header class="blog-header">
      <h1>Thinking</h1>
      <p>Essays, observations, and reflections on design, craft, and the pursuit of meaningful work.</p>
    </header>

    <div id="blog-feed">
      <div class="loading">Loading posts...</div>
    </div>
  </div>

<script>
 async function loadBlogPosts() {
  const feedContainer = document.getElementById('blog-feed');
  
  try {
    // 1. Fetch your index file
    const response = await fetch('blog-posts.json');
    const data = await response.json();
    
    // 2. Sort posts by date (newest first)
    const posts = data.posts.sort((a, b) => new Date(b.date) - new Date(a.date));

    // 3. Process each post
    const postHTMLs = await Promise.all(posts.map(async (post) => {
      try {
        // Fetch the converted Word file
        const mdResponse = await fetch(post.markdownFile);
        const mdText = await mdResponse.text();
        
        // Use Marked.js to turn MD into HTML
        const htmlContent = marked.parse(mdText);

        return `
          <article class="post">
            <div class="post-meta">
              <time class="post-date">${post.date}</time>
              <span class="post-category">${post.category}</span>
            </div>
            <h2 class="post-title">${post.title}</h2>
            <div class="post-content">
              ${htmlContent}
            </div>
          </article>
        `;
      } catch (err) {
        console.error("Could not load post file:", post.markdownFile);
        return ""; // Skip this post if the file is missing
      }
    }));

    feedContainer.innerHTML = postHTMLs.join('');
  } catch (error) {
    console.error("Error loading blog feed:", error);
    feedContainer.innerHTML = `<p>Error loading posts. Check the console.</p>`;
  }
}

document.addEventListener('DOMContentLoaded', loadBlogPosts);
</script>
</html>
