<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blog</title>

  <!-- Your CSS -->
  <link rel="stylesheet" href="/last_larch.css">

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <h1>Blog</h1>

  <div id="posts"></div>

  <script>
    const repo = "adamfysh/LastLarch-site";
    const folder = "content/blog";

    function getTitle(md) {
      const match = md.match(/^#\s(.+)/m);
      return match ? match[1] : "Untitled";
    }

    function getDate(md) {
      const match = md.match(/^date:\s*(.+)$/m);
      return match ? match[1] : "";
    }

    function stripFrontmatter(md) {
      // removes --- YAML blocks if present
      return md.replace(/^---[\s\S]*?---\n/, "");
    }

    async function loadPosts() {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}`);
      const files = await res.json();

      const container = document.getElementById("posts");

      for (const file of files) {
        if (!file.name.endsWith(".md")) continue;

        const mdRes = await fetch(file.download_url);
        const raw = await mdRes.text();

        const title = getTitle(raw);
        const date = getDate(raw);
        const body = stripFrontmatter(raw);

        const card = document.createElement("div");
        card.className = "post-card";

        card.innerHTML = `
          <h2 class="post-title">${title}</h2>
          ${date ? `<div class="post-date">${date}</div>` : ""}
          <div class="post-body">${marked.parse(body)}</div>
        `;

        container.appendChild(card);
      }
    }

    loadPosts();
  </script>
</body>
</html>
