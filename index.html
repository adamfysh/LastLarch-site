<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LastLarch | Climate Resilience Advisory</title>
    <style>
        :root {
            --bg: #F2F2F0; /* Silt White */
            --dark: #1A1A1B; /* Obsidian */
            --gold: #B98D4B; /* Weathered Larch Gold */
        }
        body {
            background-color: var(--bg);
            color: var(--dark);
            font-family: 'Helvetica Neue', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        header {
            padding: 4rem 2rem;
            border-bottom: 12px solid var(--dark);
            background: var(--dark);
            color: var(--gold);
        }
        .monolith {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            margin: 0;
        }
        main {
            padding: 4rem 2rem;
            max-width: 800px;
        }
        .statement {
            font-size: 1.5rem;
            line-height: 1.4;
            border-left: 5px solid var(--gold);
            padding-left: 2rem;
        }
        .footer {
            margin-top: auto;
            padding: 2rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            background: var(--dark);
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="monolith">LastLarch</h1>
        <p>RELIANCE AT THE TREELINE.</p>
    </header>
    <main>
        <p class="statement">
            Climate consultancy for high-stress environments. <br>
            We build strategies that hold ground when the conditions turn.
        </p>
        <p>Based at the frontier of resilience. Built to endure.</p>
    </main>
    <footer class="footer">
        © 2026 LastLarch Corp. | All Rights Reserved.
    </footer>
</body>
</html>
