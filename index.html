<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Larch</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Karla:wght@300&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            background-color: #FFFFF0; /* Ivory */
            color: #1A1A1A; /* Charcoal */
            overflow: hidden;
            position: relative;
        }

        .bg-ghost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('69c2181c-c4f7-43e9-93c1-0184851a20a5_removalai_preview.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08; 
            z-index: 0;
            filter: grayscale(100%);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 8vh 0;
            position: relative;
            z-index: 1;
        }

        /* The Symmetrical Header */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 40px; /* Space between words and logo */
        }

        .brand-header h1 {
            font-family: 'Archivo', sans-serif;
            font-weight: 500;
            /* Size matched to logo height */
            font-size: 80px; 
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            line-height: 1;
        }

        .logo-mid img {
            height: 100px; /* Base height for the logo */
            width: auto;
            display: block;
        }

        /* Nav Horizon */
        .nav-wrapper {
            width: 75%; 
            border-top: 8px solid #D4AF37; 
            border-bottom: 8px solid #D4AF37;
            padding: 3.5rem 0;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 120px; 
        }

        .nav-links a {
            font-family: 'Space Grotesk', sans-serif;
            text-decoration: none;
            color: #1A1A1A;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #D4AF37;
        }

        /* Footer */
        .footer {
            font-family: 'Karla', sans-serif;
        }

        .footer a {
            color: #1A1A1A;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            opacity: 0.5;
        }

        /* Responsive - Stack them on small screens */
        @media (max-width: 900px) {
            .brand-header { flex-direction: column; gap: 10px; }
            .brand-header h1 { font-size: 50px; letter-spacing: 0.1em; }
            .logo-mid img { height: 70px; }
            .nav-links { gap: 30px; flex-direction: column; text-align: center; }
            .nav-wrapper { width: 90%; }
        }
    </style>
</head>
<body>

    <div class="bg-ghost"></div>

    <div class="container">
        
        <header class="brand-header">
            <h1>Last</h1>
            <div class="logo-mid">
                <img src="LL Logo 4.png" alt="Logo">
            </div>
            <h1>Larch</h1>
        </header>

        <div class="nav-wrapper">
            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="blog.html">Blog</a>
            </nav>
        </div>

        <div class="footer">
            <a href="mailto:hello@lastlarch.com">CONTACT</a>
        </div>
    </div>

</body>
</html>
