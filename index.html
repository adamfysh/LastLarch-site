<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Larch</title>
  <link rel="stylesheet" href="last_larch.css">
  <link rel="icon" type="image/png" href="LL Logo 4.png">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .stage {
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
    }

    /* ── Left panel ── */
    .panel-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10vw 0 8vw;
      position: relative;
    }

    .wordmark {
      font-family: var(--ff-serif);
      font-size: clamp(52px, 8vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--charcoal);
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .wordmark-text em {
      display: block;
      font-style: italic;
      color: var(--gold-d);
    }

    .wordmark-logo {
      height: clamp(40px, 5.5vw, 68px);
      width: auto;
      opacity: 0.85;
      margin-top: 6px;
      flex-shrink: 0;
    }

    /* Ghost larch — sits below tagline, laid out horizontally */
    .ghost-frond {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 180px;
      margin-top: 28px;
      background-image: url('69c2181c-c4f7-43e9-93c1-0184851a20a5_removalai_preview.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: left center;
      opacity: 0.07;
      filter: grayscale(100%);
      transform: rotate(90deg) scaleX(-1);
    }

    .tagline {
      font-family: var(--ff-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--char-l);
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .tagline::before {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ── Right panel ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10vh 8vw 8vh 8vw;
      border-left: 0.5px solid var(--ivory-d);
      gap: 0;
    }

    /* Nav */
    .nav-block {
      display: flex;
      flex-direction: column;
      margin-bottom: 48px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 0;
      border-top: 0.5px solid var(--ivory-d);
      text-decoration: none;
      color: var(--charcoal);
      transition: padding-left 0.2s;
    }

    .nav-item:last-child {
      border-bottom: 0.5px solid var(--ivory-d);
    }

    .nav-item:hover { padding-left: 10px; }
    .nav-item:hover .nav-arrow { transform: translateX(4px); color: var(--gold); }
    .nav-item:hover .nav-label { color: var(--charcoal); }

    .nav-text { display: flex; flex-direction: column; }

    .nav-label {
      font-family: var(--ff-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--char-m);
      transition: color 0.2s;
    }

    .nav-sub {
      font-family: var(--ff-serif);
      font-size: 20px;
      line-height: 1.1;
      color: var(--charcoal);
      margin-top: 5px;
      font-style: italic;
    }

    .nav-arrow {
      font-size: 18px;
      color: var(--ivory-d);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    /* Contact */
    .contact-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .contact-block a {
      font-family: var(--ff-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--char-l);
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-block a:hover { color: var(--gold-d); }

    .contact-mark {
      font-family: var(--ff-serif);
      font-size: 12px;
      font-style: italic;
      color: var(--ivory-d);
    }

    /* ── Responsive ── */
    @media (max-width: 800px) {
      body, html { overflow: auto; }
      .stage { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      .panel-left { padding: 60px 40px 48px; }
      .panel-right { padding: 48px 40px 60px; border-left: none; border-top: 0.5px solid var(--ivory-d); gap: 48px; }
      .logo-block { justify-content: flex-start; }
      .ghost-frond { width: 100%; }
    }
  </style>
</head>
